<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<!--
  Générateur de l'image de partage (Open Graph / Twitter Card).
  Format 1200×630 — reprend la charte du site (cobalt #5A78FF + ambre #F5A524 sur #0A0D16).

  Régénérer le PNG :
    ouvrir ce fichier dans un navigateur en 1200×630 et capturer,
    ou : npx playwright screenshot --viewport-size=1200,630 assets/brand/og.html assets/brand/og.png
-->
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0a0d16;
    color: #eceef6;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    position: relative;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 78px;
  }


  .content { position: relative; z-index: 2; }


  h1 {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800;
    font-size: 74px; line-height: 1.03; letter-spacing: -.028em;
    max-width: 900px;
  }
  h1 .hl { color: #f5a524; }

  .name {
    margin-top: 24px; font-size: 20px; font-weight: 500; color: #eceef6;
  }
  .name span { color: #98a0b4; font-weight: 400; }

  /* preuves — ce qui doit rester lisible en vignette de fil LinkedIn */
  .proof { margin-top: 30px; display: flex; gap: 12px; }
  .chip {
    font-family: "JetBrains Mono", monospace; font-size: 14.5px; color: #c7cee0;
    border: 1px solid rgba(255,255,255,.13); border-radius: 999px; padding: 9px 18px;
    background: rgba(255,255,255,.035);
  }
  .chip b { color: #7a92ff; font-weight: 500; }

  /* marque */
  .mark {
    position: absolute; z-index: 2; top: 46px; left: 78px;
    font-family: "JetBrains Mono", monospace; font-size: 18px; color: #8891a6;
    display: flex; align-items: center; gap: 12px;
  }
  .mark .k {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: rgba(90,120,255,.16); border: 1px solid rgba(90,120,255,.4);
    color: #7a92ff; font-weight: 700; font-size: 19px; position: relative;
  }
  .mark .k::after {
    content: ""; position: absolute; top: -3px; right: -3px;
    width: 9px; height: 9px; border-radius: 50%; background: #f5a524;
  }

  .url {
    position: absolute; z-index: 2; bottom: 44px; left: 78px;
    font-family: "JetBrains Mono", monospace; font-size: 16px; letter-spacing: .03em; color: #626a80;
  }
  .url b { color: #7a92ff; font-weight: 500; }
</style>
</head>
<body>
  <div class="mark"><span class="k">K</span> Kined</div>

  <div class="content">
    <h1>De l'idée au produit<br><span class="hl">en production</span>.</h1>
    <div class="name">Ingénieur Fullstack Produit <span>· Freelance · Remote</span></div>
    <div class="proof">
      <span class="chip"><b>20+</b> projets livrés</span>
      <span class="chip"><b>2</b> startups co-fondées</span>
      <span class="chip">Web · Mobile · DevOps</span>
    </div>
  </div>

  <div class="url">🌐 <b>ki-ned.github.io/ki-ned</b></div>
</body>
</html>
